<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃子影视 — Taozi Video</title>
  <style>
    :root { --accent: #ff6b6b; --bg: #0d1117; --fg: #c9d1d9; --muted: #8b949e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--fg); line-height: 1.7;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
      padding: 60px 20px;
    }
    .container { max-width: 680px; width: 100%; }
    h1 { font-size: 2.4rem; margin-bottom: 8px; letter-spacing: -1px; }
    .tagline { color: var(--muted); font-size: 1.05rem; margin-bottom: 32px; }
    .badge {
      display: inline-block; background: rgba(255,107,107,0.15); color: var(--accent);
      padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 24px;
    }
    .section { margin-bottom: 36px; }
    .section h2 { font-size: 1.2rem; margin-bottom: 12px; color: #f0f6fc; }
    .section p, .section li { color: var(--muted); font-size: 0.95rem; }
    .section ul { padding-left: 20px; }
    .section li { margin-bottom: 6px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; text-decoration: none;
      padding: 12px 24px; border-radius: 8px; font-weight: 500;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .btn-outline {
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    footer { margin-top: auto; padding-top: 60px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Android TV / Mobile</div>
    <h1>🍑 桃子影视</h1>
    <p class="tagline">基于 FongMi/TV 二次魔改的影视播放器 —— 配置即封装，开箱即用</p>

    <div class="section">
      <h2>特点</h2>
      <ul>
        <li>内置源离线包，首次启动无需在线导入接口</li>
        <li>保留点播、直播、Spider、解析、投屏等完整能力</li>
        <li>支持本地 HTTP 服务与网盘多盘聚合</li>
        <li>双配置切换：默认配置 + 进阶配置（含网盘认证源）</li>
      </ul>
    </div>

    <div class="section">
      <h2>快速开始</h2>
      <pre style="background:#161b22;padding:16px;border-radius:8px;overflow-x:auto;font-size:0.85rem;color:#c9d1d9;">
bash gradlew :app:assembleMobileArm64_v8aRelease
      </pre>
    </div>

    <div class="section">
      <div class="actions">
        <a class="btn" href="https://github.com/Hippo1096/taozi-video" target="_blank">📂 查看源码</a>
        <a class="btn btn-outline" href="https://github.com/Hippo1096/taozi-video/releases" target="_blank">⬇️ 下载 APK</a>
      </div>
    </div>
  </div>

  <footer>
    © Hippo1096 · 桃子影视 · 开源项目
  </footer>
</body>
</html>
